name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Windows is the supported target: the shell integration, the drag payload
    # and the folder icons are all Win32. See `portable` for macOS and Linux.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # The toolchain is pinned by rust-toolchain.toml, so nothing is chosen here.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix ui ci

      # Before the Rust build: the frontend is embedded in the binary, so a
      # release build with no `ui/dist` is a binary that points at a dev server.
      - name: Build the frontend
        run: npm --prefix ui run build

      - name: Typecheck the frontend
        run: npx --prefix ui tsc --noEmit -p ui/tsconfig.json

      - name: Test the frontend
        run: npm --prefix ui test

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The ignored tests need a real music library or the network, and are run
      # by hand — see the README.
      - name: Tests
        run: cargo test --workspace

  portable:
    # macOS and Linux are not supported yet: this shows how far they are from
    # building and passing, without turning master red while that work is open.
    name: portable (${{ matrix.os }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Tauri's WebKitGTK and GTK, and ALSA for the player.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev

      - name: Install frontend dependencies
        run: npm --prefix ui ci

      - name: Build the frontend
        run: npm --prefix ui run build

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Tests
        run: cargo test --workspace

      # Last, so lints left by the Windows-only code don't hide build or test
      # failures.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
