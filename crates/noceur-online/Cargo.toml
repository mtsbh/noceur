[package]
name = "noceur-online"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking rather than async: every caller is already on a blocking task, and an
# async client would drag a runtime into a crate that makes at most one request
# at a time by design.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
