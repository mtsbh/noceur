[package]
name = "noceur-audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[dev-dependencies]
tempfile = "3"
# Only for the ignored real-library check, which needs to know what each file
# claims before it can say whether the claim is true.
lofty = "0.22"
noceur-tags = { path = "../noceur-tags" }

[dependencies]
thiserror.workspace = true
noceur-fsmodel = { path = "../noceur-fsmodel" }
# rodio drives cpal for output and symphonia for decoding, which is what the
# design calls for; wrapping them by hand would be the same two crates plus the
# resampling and device-format work rodio already does.
#
# Use rodio's own format features, not the `symphonia-*` ones they expand to.
# Those are split between container readers and codecs — `symphonia-wav` parses
# a WAV header but decodes nothing without `symphonia-pcm`, and a file whose
# container reads and whose samples do not is reported as "cannot decode".
rodio = { version = "0.22", default-features = false, features = [
  "playback",
  "wav",
  "flac",
  "mp3",
  "mp4",
  "vorbis",
  "symphonia-aiff",
  "symphonia-alac",
  "symphonia-adpcm",
] }
# The same symphonia rodio decodes with, for Check quality, which has to see
# the packets rodio quietly skips: a decode error is exactly what it looks for.
# No features of its own; rodio's above choose the formats.
symphonia = { version = "0.5", default-features = false }
# Chromaprint fingerprints for AcoustID lookups. Pure Rust, and its output
# matches `fpcalc`, so there is no C library or bundled executable to ship.
rusty-chromaprint = "0.3"
