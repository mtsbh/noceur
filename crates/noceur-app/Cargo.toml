[package]
name = "noceur-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Switches Tauri from loading the front end off the dev server to serving the
# built assets embedded in the executable. Without it a release build starts up
# pointing at http://localhost:1420 and shows "localhost refused to connect" to
# anyone who does not happen to have `npm run dev` running.
#
# The Tauri CLI turns this on for `tauri build`; a plain `cargo build --release`
# does not, so every release build here has to pass `--features custom-protocol`.
# See `docs/building.md`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
noceur-fsmodel = { path = "../noceur-fsmodel" }
noceur-tags = { path = "../noceur-tags" }
noceur-art = { path = "../noceur-art" }
noceur-audio = { path = "../noceur-audio" }
noceur-index = { path = "../noceur-index" }
noceur-online = { path = "../noceur-online" }
serde_json = "1"
# Copies tags and art into converted files; the same version noceur-tags uses.
lofty = "0.22"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Time",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
