# esbuild ships a prebuilt native binary and needs its postinstall script to run.
# pnpm 10+ blocks dependency build scripts until they are explicitly approved; in a
# non-interactive shell it writes a "set this to true or false" stub here and waits,
# which hangs the build. Answering it up front keeps installs unattended.
allowBuilds:
  esbuild: true
onlyBuiltDependencies:
  - esbuild
